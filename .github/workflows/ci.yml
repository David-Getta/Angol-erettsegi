# Érettségi felkészítő — ellenőrzés minden pusholásnál: típusok, tesztek,
# tartalomvalidálás, és hogy az asztali app Electron-rétege lefordul.
name: ci

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # a kiadást a release workflow ellenőrzi
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run desktop:bundle
